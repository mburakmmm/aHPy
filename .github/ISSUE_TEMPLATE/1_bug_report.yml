name: aHPy bug report
description: Report a compiler, generated-code, build, or runtime defect
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve aHPy. Check the [support matrix](https://github.com/mburakmmm/aHPy/blob/main/docs/ahpy/support-matrix.md) before filing: an explicitly rejected or blocked HPy 0.9 surface is not yet a supported-feature regression.

        Do not include secrets. Report security vulnerabilities privately through [GitHub Security Advisories](https://github.com/mburakmmm/aHPy/security/advisories/new).
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Compiler or diagnostic
        - Generated Universal HPy C
        - Runtime semantics or handle ownership
        - Build system or packaging
        - CI, tests, or documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest .py/.pyx source and the exact command used.
      value: |
        ```cython
        # minimal source
        ```

        ```console
        python -m cython --runtime-backend=hpy-universal -3 module.pyx
        ```
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the complete diagnostic, traceback, generated-code audit, or runtime failure.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe the expected Python semantics or fail-closed diagnostic.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: aHPy revision
      description: Commit SHA or aHPy-compiler version. Prefer a full commit SHA.
      placeholder: 40-character commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, HPy, OS, architecture, and compiler
      placeholder: CPython 3.11.15; HPy 0.9.0; Ubuntu 24.04 x86-64; GCC 14
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Paste `python Tools/ahpy/doctor.py --python <python> --json` output when the failure reaches a native build.
      render: json
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and tested the current `main` or linked development revision.
          required: true
        - label: I confirmed that this is an aHPy issue rather than a request for support from upstream Cython or HPy.
          required: true
