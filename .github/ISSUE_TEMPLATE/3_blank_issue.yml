name: Design or support question
description: Ask an aHPy-specific question that is not a bug or feature proposal
title: "[QUESTION] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        This tracker covers aHPy. For upstream Cython behavior use [cython/cython](https://github.com/cython/cython); for HPy runtime/API behavior use [hpyproject/hpy](https://github.com/hpyproject/hpy).
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include relevant source, commands, support-matrix rows, or ADRs.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I checked the README, onboarding guide, support matrix, and existing issues.
          required: true
