name: aHPy feature request
description: Propose a Universal HPy compiler or ecosystem capability
title: "[ENH] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        aHPy only promotes a feature when semantics, ownership, failure paths, HPy Debug behavior, and the Universal ABI boundary are testable. Check the [roadmap](https://github.com/mburakmmm/aHPy/blob/main/TODO.md) and [support matrix](https://github.com/mburakmmm/aHPy/blob/main/docs/ahpy/support-matrix.md) first.
  - type: textarea
    id: problem
    attributes:
      label: Problem and motivating source
      description: Explain the porting problem and include representative Cython source.
      value: |
        ```cython
        # representative source
        ```
    validations:
      required: true
  - type: textarea
    id: semantics
    attributes:
      label: Required semantics
      description: Describe success, errors, cleanup, interpreter isolation, and compatibility expectations.
    validations:
      required: true
  - type: textarea
    id: hpy_surface
    attributes:
      label: Public HPy surface
      description: Link the public HPy APIs that could implement the feature, or explain the suspected HPy gap.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include migration workarounds. CPython or HPy Hybrid fallback is not an accepted Universal implementation.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched the roadmap, support matrix, ADRs, and existing issues.
          required: true
        - label: I understand that unsupported Universal behavior must fail closed instead of falling back to CPython.
          required: true
