name: aHPy TestPyPI rehearsal

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload the validated candidate to TestPyPI"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build-testpypi-candidate:
    name: build TestPyPI candidate without uploading
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout selected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tests/ahpy/requirements-hpy09.txt
            tests/ahpy/requirements-build-systems.txt
            tests/ahpy/requirements-publish.txt
      - name: Install pinned rehearsal toolchain
        run: >-
          python -m pip install
          -r tests/ahpy/requirements-hpy09.txt
          -r tests/ahpy/requirements-build-systems.txt
          -r tests/ahpy/requirements-publish.txt
      - name: Build and validate clean release evidence
        run: >-
          python Tools/ahpy/release_artifact_integration.py
          --python python
          --output packaging-results/release-artifacts.json
          --bundle-dir packaging-results/release-bundle
      - name: Rebuild reproducible package archives
        run: >-
          python Tools/ahpy/verify_reproducible_packages.py
          --python python
          --output packaging-results/package-reproducibility.json
      - name: Select exact frontend publication files
        run: >-
          python Tools/ahpy/prepare_publish_dist.py
          --bundle-dir packaging-results/release-bundle
          --publish-dir packaging-results/publish-dist
          --repository testpypi
          --output packaging-results/testpypi-dry-run.json
      - name: Validate package descriptions
        run: python -m twine check --strict packaging-results/publish-dist/*
      - name: Upload immutable publication candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahpy-testpypi-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packaging-results/publish-dist
            packaging-results/testpypi-dry-run.json
            packaging-results/release-artifacts.json
            packaging-results/package-reproducibility.json
          if-no-files-found: error
          retention-days: 30

  publish-testpypi:
    name: publish approved candidate to TestPyPI
    if: ${{ inputs.publish }}
    needs: build-testpypi-candidate
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aHPy-compiler
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ahpy-testpypi-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Publish through TestPyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: candidate/publish-dist
          skip-existing: false
          attestations: true
          verbose: true
