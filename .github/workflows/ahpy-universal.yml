name: aHPy Universal

on:
  push:
    branches:
      - main
      - "ahpy/**"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  compiler-and-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tests/ahpy/requirements-hpy09.txt
            tests/ahpy/requirements-build-systems.txt
      - name: Install stable HPy lane
        run: python -m pip install -r tests/ahpy/requirements-hpy09.txt
      - name: Install pinned external build systems
        run: python -m pip install -r tests/ahpy/requirements-build-systems.txt
      - name: Diagnose Universal toolchain
        run: python Tools/ahpy/doctor.py --python python --strict
      - name: Source compatibility self-scan
        run: >-
          python Tools/ahpy/scan_compatibility.py
          tests/ahpy/bootstrap_answer.pyx
          tests/ahpy/fault_injection.pyx
          examples/ahpy_setuptools/ahpy_setuptools_example.pyx
          --python python
          --json
      - name: Setuptools and cythonize Universal integration
        run: python Tools/ahpy/setuptools_integration.py --python python
      - name: Direct non-setuptools Universal integration
        run: python Tools/ahpy/direct_build_integration.py --python python
      - name: Isolated PEP 517 Universal integration
        run: >-
          python Tools/ahpy/pep517_integration.py
          --python python
          --output packaging-results/pep517.json
      - name: Clean sdist and onboarding integration
        run: >-
          python Tools/ahpy/release_artifact_integration.py
          --python python
          --output packaging-results/release-artifacts.json
          --bundle-dir packaging-results/release-bundle
      - name: Reproducible frontend package archives
        run: >-
          python Tools/ahpy/verify_reproducible_packages.py
          --python python
          --output packaging-results/package-reproducibility.json
      - name: Upload isolated packaging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahpy-pep517-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packaging-results/pep517.json
            packaging-results/release-artifacts.json
            packaging-results/release-bundle
            packaging-results/package-reproducibility.json
          if-no-files-found: error
      - name: CMake and Meson Universal integrations
        run: >-
          python Tools/ahpy/build_system_integration.py
          --python python
          --system all
          --output packaging-results/build-systems.json
      - name: Isolated scikit-build-core Universal integration
        run: >-
          python Tools/ahpy/scikit_build_integration.py
          --python python
          --output packaging-results/scikit-build.json
      - name: Upload external build-system evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahpy-build-systems-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packaging-results/build-systems.json
            packaging-results/scikit-build.json
          if-no-files-found: error
      - name: Focused compiler and ownership tests
        run: >-
          python -m unittest
          Cython.Compiler.Tests.TestHandleModel
          Cython.Compiler.Tests.TestRuntimeAPI
          Cython.Compiler.Tests.TestHPyModuleWriter
          Cython.Compiler.Tests.TestCmdLine
          Cython.Compiler.Tests.TestCode
      - name: Determinism, pins, and audit-tool tests
        run: python -m unittest discover -s Tools/ahpy -p "test_*.py"
      - name: Focused aHPy coverage floors
        run: >-
          python Tools/ahpy/report_coverage.py
          --fail-under backend=100
          --fail-under frontend_seam=45
          --fail-under quality_tools=41
      - name: Universal HPy performance regression budgets
        run: >-
          python Tools/ahpy/benchmark_hpy.py
          --python python
          --output performance-results/benchmark.json
      - name: Upload performance history record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahpy-performance-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-results/benchmark.json
          if-no-files-found: error
      - name: API and allocation fault injection
        run: python Tools/ahpy/test_fault_injection.py --python python
      - name: Bounded parallel HPy stress
        id: parallel_stress
        run: >-
          python Tools/ahpy/stress_parallel_hpy.py
          --python python
          --rounds 1
          --native-optimization 0
          --timeout-seconds 600
          --output stress-results/parallel-hpy.json
      - name: Upload parallel stress evidence
        if: ${{ always() && steps.parallel_stress.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahpy-parallel-stress-${{ github.run_id }}-${{ github.run_attempt }}
          path: stress-results
          if-no-files-found: error
      - name: Deterministic supported-surface fuzz oracle
        run: >-
          python Tools/ahpy/fuzz_supported_surface.py
          --python python
          --seed 0xA4F9
          --cases 48
      - name: Coverage-guided frontend and runtime mutations
        run: >-
          python Tools/ahpy/coverage_guided_fuzz.py
          --python python
          --seed 0xC0A4F9
          --candidates 64
      - name: Reproducible Universal artifact
        run: >-
          python Tools/ahpy/verify_reproducible_artifact.py
          --python python
      - name: CPython C and C++ semantic oracle
        run: python runtests.py -vv --backends=c,cpp ahpy_
      - name: Syntax and whitespace gates
        run: |
          python -m compileall -q Cython Tools/ahpy
          git diff --check

  stable-universal:
    name: stable (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gcc
            os: ubuntu-24.04
            architecture: x64
            cc: gcc
            cflags: -O0
          - name: linux-x64-clang
            os: ubuntu-24.04
            architecture: x64
            cc: clang
            cflags: -O0
          - name: linux-arm64-gcc
            os: ubuntu-24.04-arm
            architecture: arm64
            cc: gcc
            cflags: -O0
          - name: macos-intel-clang
            os: macos-15-intel
            architecture: x64
            cc: clang
            cflags: -O0
          - name: macos-arm64-clang
            os: macos-15
            architecture: arm64
            cc: clang
            cflags: -O0
          - name: windows-x64-msvc
            os: windows-2025
            architecture: x64
            cc: cl
            cflags: /Od
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: tests/ahpy/requirements-hpy09.txt
      - name: Install stable HPy lane
        run: python -m pip install -r tests/ahpy/requirements-hpy09.txt
      - name: Build, audit, and run Universal module
        env:
          CC: ${{ matrix.cc }}
          CFLAGS: ${{ matrix.cflags }}
        run: python Tools/ahpy/test_generated_hpy.py --python python
      - name: Direct non-setuptools build and load
        env:
          CC: ${{ matrix.cc }}
        run: python Tools/ahpy/direct_build_integration.py --python python

  development-revision:
    name: HPy development (${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            experimental: false
          - python: "3.14"
            experimental: true
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tests/ahpy/requirements-hpy-dev.txt
      - name: Install pinned HPy development revision
        run: python -m pip install -r tests/ahpy/requirements-hpy-dev.txt
      - name: Classify minimal HPy heap-type compatibility
        env:
          CFLAGS: -O0
        run: >-
          python Tools/ahpy/reproduce_hpy_dev_closure.py
          --python python
      - name: Build, audit, and run Universal module
        env:
          CFLAGS: -O0
        run: python Tools/ahpy/test_generated_hpy.py --python python

  sanitizers:
    name: sanitizers (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc
          - name: macos-arm64-clang
            os: macos-15
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/ahpy/requirements-hpy09.txt
      - name: Install stable HPy lane
        run: python -m pip install -r tests/ahpy/requirements-hpy09.txt
      - name: Run generated corpus with ASan and UBSan
        run: >-
          python Tools/ahpy/run_sanitized_hpy.py
          --python python
          --cc ${{ matrix.cc }}

  native-memory-valgrind:
    name: native memory gate (Linux Valgrind definite leaks)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/ahpy/requirements-hpy09.txt
      - name: Install stable HPy lane and Valgrind
        run: |
          python -m pip install -r tests/ahpy/requirements-hpy09.txt
          sudo apt-get update
          sudo apt-get install --no-install-recommends valgrind
      - name: Detect positive control and reject generated-corpus definite leaks
        env:
          CFLAGS: -O0 -g0
        run: >-
          python Tools/ahpy/run_lsan_hpy.py
          --python python
          --cc gcc
          --build-dir valgrind-evidence
      - name: Upload Valgrind evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahpy-valgrind-${{ github.run_id }}-${{ github.run_attempt }}
          path: valgrind-evidence
          if-no-files-found: warn

  native-memory-windows:
    name: native memory gate (Windows AppVerifier full page heap)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python 3.11 x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: tests/ahpy/requirements-hpy09.txt
      - name: Install stable HPy lane
        run: python -m pip install -r tests/ahpy/requirements-hpy09.txt
      - name: Detect native overrun and inspect generated Universal corpus
        env:
          CFLAGS: /Od
        run: >-
          python Tools/ahpy/run_appverifier_hpy.py
          --python python
          --build-dir appverifier-evidence
      - name: Upload AppVerifier evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahpy-appverifier-${{ github.run_id }}-${{ github.run_attempt }}
          path: appverifier-evidence
          if-no-files-found: warn

  build-portability-artifact:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up CPython 3.11 builder
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/ahpy/requirements-hpy09.txt
      - name: Install stable HPy lane
        run: python -m pip install -r tests/ahpy/requirements-hpy09.txt
      - name: Build portability artifact once
        env:
          CFLAGS: -O0
        run: >-
          python Tools/ahpy/build_portability_artifact.py
          --python python
          --output portability-artifact
      - name: Upload unchanged Universal binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahpy-linux-x64-universal
          path: portability-artifact
          if-no-files-found: error

  cross-interpreter:
    name: same binary (${{ matrix.name }})
    needs: build-portability-artifact
    runs-on: ubuntu-24.04
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PyPy-7.3.23
            python: pypy3.11-v7.3.23
          - name: GraalPy-25.1.3
            python: graalpy-25.1.3
    steps:
      - name: Set up target interpreter
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install loader dependency
        run: python -m pip install setuptools==80.9.0
      - name: Download unchanged CPython-built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ahpy-linux-x64-universal
          path: portability-artifact
      - name: Report target interpreter
        run: >-
          python -c "import platform;
          print(platform.python_implementation(), platform.python_version())"
      - name: Execute staged unchanged Universal binaries
        run: python portability-artifact/portability_smoke.py

  required-success:
    name: aHPy required checks
    needs:
      - compiler-and-quality
      - stable-universal
      - development-revision
      - sanitizers
      - build-portability-artifact
    if: always()
    env:
      FAIL: ${{ case(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'), 1, 0) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Verify required jobs
        run: exit $FAIL

  nightly-interpreter:
    name: early warning (CPython 3.15-dev + HPy 0.9)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up moving CPython prerelease
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.15-dev"
      - name: Create nightly evidence directory
        run: python -c "from pathlib import Path; Path('nightly-evidence').mkdir()"
      - name: Install stable HPy against moving interpreter
        run: >-
          python -m pip install
          --report nightly-evidence/pip-install.json
          -r tests/ahpy/requirements-hpy09.txt
      - name: Record exact interpreter and release dependency
        run: >-
          python Tools/ahpy/report_nightly_environment.py
          --lane interpreter
          --requested-python 3.15-dev
          --output nightly-evidence/environment.json
      - name: Build, audit, and run Universal module
        timeout-minutes: 30
        env:
          CFLAGS: -O0
        run: python Tools/ahpy/test_generated_hpy.py --python python
      - name: Upload interpreter-nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahpy-nightly-interpreter-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-evidence
          if-no-files-found: warn

  nightly-hpy:
    name: early warning (CPython 3.11 + HPy master)
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up stable CPython 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Create nightly evidence directory
        run: python -c "from pathlib import Path; Path('nightly-evidence').mkdir()"
      - name: Install moving HPy master
        run: >-
          python -m pip install
          --no-cache-dir
          --report nightly-evidence/pip-install.json
          -r tests/ahpy/requirements-hpy-nightly.txt
      - name: Record exact resolved HPy commit
        run: >-
          python Tools/ahpy/report_nightly_environment.py
          --lane hpy
          --requested-python 3.11
          --require-hpy-vcs
          --expected-hpy-url https://github.com/hpyproject/hpy.git
          --expected-hpy-ref master
          --output nightly-evidence/environment.json
      - name: Build, audit, and run Universal module
        timeout-minutes: 30
        env:
          CFLAGS: -O0
        run: python Tools/ahpy/test_generated_hpy.py --python python
      - name: Upload HPy-nightly evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ahpy-nightly-hpy-${{ github.run_id }}-${{ github.run_attempt }}
          path: nightly-evidence
          if-no-files-found: warn
