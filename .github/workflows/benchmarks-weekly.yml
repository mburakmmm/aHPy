name: Benchmarks (weekly)

on:
  schedule:
  #        ┌───────────── minute (0 - 59)
  #        │  ┌───────────── hour (0 - 23)
  #        │  │ ┌───────────── day of the month (1 - 31)
  #        │  │ │ ┌───────────── month (1 - 12 or JAN-DEC)
  #        │  │ │ │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
  #        │  │ │ │ │
  - cron: "22 3 * * SUN"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/benchmarks-weekly.yml"
  workflow_dispatch:


permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  benchmarks:
    strategy:
      # Allows for matrix sub-jobs to fail without canceling the rest
      fail-fast: false

      matrix:
        os:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          #- "macos-latest"    # currently crashes
          #- "windows-latest"  # needs more setup work

    runs-on: ${{ matrix.os }}
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'cython/cython' }}
    timeout-minutes: 600

    env:
      CCACHE_SLOPPINESS: "pch_defines,time_macros"
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 5
      CCACHE_NOHASHDIR: 1
      CFLAGS: -O3 -g1 -fPIC -mtune=generic
      BENCHMARK_CYTHONIZE_ARGS: -Xauto_pickle=False

    steps:
      - name: Checkout repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch upstream benchmark revisions
        run: |
          git remote add upstream https://github.com/cython/cython.git
          git fetch --force --tags upstream \
            +refs/heads/3.0.x:refs/remotes/upstream/3.0.x \
            +refs/heads/3.1.x:refs/remotes/upstream/3.1.x \
            +refs/heads/3.2.x:refs/remotes/upstream/3.2.x \
            +refs/heads/master:refs/remotes/upstream/master

      - name: Compilation Cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          create-symlink: true
          variant: ${{ startsWith(runner.os, 'Windows') && 'sccache' || 'ccache' }}  # fake ternary
          key: ${{ runner.os }}-${{ runner.arch }}-hendrikmuhs-ccache-benchmarks
          max-size: 250M

      - name: Setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          # List special Pythons first to keep the 'normal' one as (last) "python3.xy".
          python-version: |
            3.14t
            3.15-dev
            pypy-3.11
            3.10
            3.12
            3.13
            3.14

      - name: Run Benchmarks
        run: |
          set -o pipefail
          # Run benchmarks in all Python versions, Limited C-API only in latest (listed first below).
          LIMITED_API=--with-limited
          for PYTHON in \
                python3.14 \
                python3.13 \
                python3.14t \
                python3.15 \
                python3.12 \
                python3.10 \
                ; do
              ${PYTHON} -m pip install setuptools numpy
              CYTHONIZE_ARGS="${BENCHMARK_CYTHONIZE_ARGS}"

              if [[ ${PYTHON} == *t || ${PYTHON} == *"t-dev" ]]; then
                COMMITS=("upstream/3.1.x" "upstream/3.2.x" "upstream/master")
                CYTHONIZE_ARGS="${CYTHONIZE_ARGS} -Xfreethreading_compatible=True"
              elif [[ ${PYTHON} == "pypy"* ]]; then
                COMMITS=("upstream/3.1.x" "upstream/3.2.x" "upstream/master")
              else
                COMMITS=("upstream/3.0.x" "upstream/3.1.x" "upstream/3.2.x" "${LIMITED_API}" "upstream/master")
              fi

              ${PYTHON} Demos/benchmarks/run_benchmarks.py \
                  ${{ startsWith(runner.os, 'Windows') && ' ' || '--report-size benchmark_sizes_${PYTHON}.csv' }} \
                  --report benchmark_results_${PYTHON}.csv \
                  --with-python  ${CYTHONIZE_ARGS}  ${COMMITS[*]}

              LIMITED_API=
          done | tee benchmarks.log
          # Add empty size result file to keep the size report on Windows from failing.
          touch benchmark_sizes_empty.csv

      - name: Create summary
        run: |
          shopt -s nullglob
          timing_files=(benchmark_results_*.csv)
          size_files=(benchmark_sizes_*.csv)
          if (( ${#timing_files[@]} == 0 || ${#size_files[@]} == 0 )); then
            echo "::error::Benchmark command succeeded without producing the required timing and size CSV files."
            exit 1
          fi
          { echo "## Benchmark results on ${{ runner.os }}-${{ runner.arch }}:";
            echo; python Demos/benchmarks/report.py -t timings "${timing_files[@]}";
            echo; echo "## Benchmark module sizes on ${{ runner.os }}-${{ runner.arch }}:";
            echo; python Demos/benchmarks/report.py -t sizes "${size_files[@]}";
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload CSV results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-csv-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark_results_*.csv
            benchmark_sizes_*.csv
          if-no-files-found: error

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark_results_${{ matrix.os }}.txt
          path: benchmarks.log
