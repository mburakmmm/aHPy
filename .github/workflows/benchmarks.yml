name: Benchmarks

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "ahpy/**"
  pull_request:
    # Accepted labels (in the 'if' condition below) are:
    # * benchmark (explicit)
    # * performance (implicit)
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  file-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout push history
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select benchmark-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - ".github/workflows/benchmarks.yml"
              - "Demos/benchmarks/**"
              - "Cython/Utility/**"
              - "Cython/Compiler/Nodes.py"
              - "Cython/Compiler/ExprNodes.py"
              - "Cython/Compiler/Optimize.py"

  benchmarks:
    name: benchmarks (${{ matrix.name }})
    needs: [file-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - name: "3.14"
            python_version: "3.14"
            executable: python3.14
            free_threaded: false
            limited_api: "--with-limited"
          - name: "3.13"
            python_version: "3.13"
            executable: python3.13
            free_threaded: false
            limited_api: ""
          - name: "3.14t"
            python_version: "3.14t"
            executable: python3.14t
            free_threaded: true
            limited_api: ""
          - name: "3.12"
            python_version: "3.12"
            executable: python3.12
            free_threaded: false
            limited_api: ""
          - name: "3.10"
            python_version: "3.10"
            executable: python3.10
            free_threaded: false
            limited_api: ""

    if: >-
      ${{
        always() &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.file-changes.outputs.relevant == 'true' ||
          (
            github.event.action == 'labeled' &&
            (
              github.event.label.name == 'benchmark' ||
              github.event.label.name == 'performance'
            )
          )
        )
      }}
    env:
      CCACHE_SLOPPINESS: "pch_defines,time_macros"
      CCACHE_COMPRESS: 1
      CCACHE_COMPRESSLEVEL: 5
      CCACHE_NOHASHDIR: 1
      CFLAGS: -O3 -g1 -fPIC -mtune=generic
      BENCHMARK_CYTHONIZE_ARGS: -Xauto_pickle=False

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Fetch upstream benchmark revisions
        run: |
          git remote add upstream https://github.com/cython/cython.git
          git fetch --force --tags upstream \
            +refs/heads/3.0.x:refs/remotes/upstream/3.0.x \
            +refs/heads/3.1.x:refs/remotes/upstream/3.1.x \
            +refs/heads/master:refs/remotes/upstream/master

      - name: Compilation Cache
        uses: hendrikmuhs/ccache-action@d62db5f07c26379fc4b4e0916f098a92573c3b03 # v1.2.23
        with:
          create-symlink: true
          variant: ${{ startsWith(runner.os, 'Windows') && 'sccache' || 'ccache' }}  # fake ternary
          save: ${{ startsWith(github.ref, 'refs/pull/') && 'false' || 'true' }}  # fake ternary
          key: ${{ runner.os }}-${{ runner.arch }}-hendrikmuhs-ccache-benchmarks-${{ matrix.name }}
          max-size: 250M

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python_version }}

      - name: Run Benchmarks
        run: |
          set -o pipefail
          PYTHON="${{ matrix.executable }}"
          ${PYTHON} -m pip install setuptools numpy
          if [[ "${{ matrix.free_threaded }}" == "true" ]]; then
            COMMITS=("upstream/3.1.x" "upstream/master" "HEAD")
            CYTHONIZE_ARGS="${BENCHMARK_CYTHONIZE_ARGS} -Xfreethreading_compatible=True"
          else
            LIMITED_API="${{ matrix.limited_api }}"
            COMMITS=("upstream/3.0.x" "3a7a936e099df468dcaa01829ae6567c577489c0" "${LIMITED_API}" "upstream/master" "${LIMITED_API}" "HEAD")
            CYTHONIZE_ARGS="${BENCHMARK_CYTHONIZE_ARGS}"
          fi
          ${PYTHON} Demos/benchmarks/run_benchmarks.py \
            --report-size benchmark_sizes_${PYTHON}.csv \
            --report benchmark_results_${PYTHON}.csv \
            --with-python ${CYTHONIZE_ARGS} ${COMMITS[*]} \
            | tee benchmarks.log

      - name: Create summary
        run: |
          shopt -s nullglob
          timing_files=(benchmark_results_*.csv)
          size_files=(benchmark_sizes_*.csv)
          if (( ${#timing_files[@]} == 0 || ${#size_files[@]} == 0 )); then
            echo "::error::Benchmark command succeeded without producing the required timing and size CSV files."
            exit 1
          fi
          { echo "## Benchmark results (${{ matrix.name }}):";
            echo; python Demos/benchmarks/report.py -t timings "${timing_files[@]}";
            echo; echo "## Benchmark module sizes (${{ matrix.name }}):";
            echo; python Demos/benchmarks/report.py -t sizes "${size_files[@]}";
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload CSV results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-csv-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            benchmark_results_*.csv
            benchmark_sizes_*.csv
          if-no-files-found: error

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ matrix.name }}
          path: benchmarks.log

  benchmarks-success:
    name: benchmark required checks
    needs: [file-changes, benchmarks]
    if: always()
    env:
      FAIL: ${{ case(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'), 1, 0) }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected benchmark jobs
        run: exit $FAIL
