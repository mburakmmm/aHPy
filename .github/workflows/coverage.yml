name: coverage

on:
  push:
    branches:
      - main
      - "ahpy/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  file-changes:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout push history
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select coverage-relevant changes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            relevant:
              - ".github/workflows/coverage.yml"
              - "Cython/**"
              - "!Cython/Utility/**"
              - "tests/**"

  pycoverage:
    needs: [file-changes]
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.file-changes.outputs.relevant == 'true'
        )
      }}
    runs-on: ubuntu-24.04

    permissions:
      # deploy HTML to GitHub pages
      pages: write
      id-token: write

    env:
      BACKEND: c,cpp
      OS_NAME: ubuntu-24.04
      PYTHON_VERSION: "3.12"
      HEAD: "${{ github.head_ref || github.ref_name }}"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Coverage
        env: { COVERAGE: 1, NO_CYTHON_COMPILE: 1 }
        run: bash ./Tools/ci-run.sh

      - name: Copy coverage HTML
        run: |
          if [ -d './coverage-report-html' ]; then
            ESCAPED_HEAD=$(python3 -c "import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe=''))" "$HEAD")
            mkdir -p gh_pages_coverage/coverage/ \
              && cp -r './coverage-report-html' "gh_pages_coverage/coverage/$ESCAPED_HEAD";
          fi

      - name: Upload Coverage HTML to GH Pages
        if: github.repository == 'cython/cython' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './gh_pages_coverage/'

      - name: deploy to Github Pages
        if: github.repository == 'cython/cython' && github.event_name != 'pull_request'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: htmldeploy

      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pycoverage_html
          path: coverage-report-html

      - name: Write summary
        run: |
          echo "## Python coverage results:" >> $GITHUB_STEP_SUMMARY
          PAGES_URL="${{ steps.htmldeploy.outputs.page_url }}"
          ESCAPED_HEAD=$(python3 -c "import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe=''))" "$HEAD")
          if [ -n "${PAGES_URL}" ]; then echo "[Coverage HTML](${PAGES_URL}/coverage/$ESCAPED_HEAD)" >> $GITHUB_STEP_SUMMARY; fi
          if [ -f coverage-report.md ]; then { echo; cat coverage-report.md ; } >> $GITHUB_STEP_SUMMARY; fi

  cycoverage:
    runs-on: ubuntu-24.04
    needs: [file-changes, pycoverage]  # order summary report output
    if: >-
      ${{
        always() &&
        (
          github.event_name == 'workflow_dispatch' ||
          needs.file-changes.outputs.relevant == 'true'
        ) &&
        needs.pycoverage.result == 'success'
      }}

    env:
      BACKEND: c,cpp
      OS_NAME: ubuntu-24.04
      PYTHON_VERSION: "3.12"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run Coverage
        env: { COVERAGE: 1 }
        run: bash ./Tools/ci-run.sh

      - name: Write summary
        run: |
          if [ -f coverage-report.md ]; then { echo "## Compiled coverage results:"; cat coverage-report.md ; } >> $GITHUB_STEP_SUMMARY; fi

      - name: Upload Coverage HTML Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cycoverage_html
          path: coverage-report-html

  coverage-success:
    name: coverage required checks
    needs: [file-changes, pycoverage, cycoverage]
    if: always()
    env:
      FAIL: ${{ case(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'), 1, 0) }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify selected coverage jobs
        run: exit $FAIL
