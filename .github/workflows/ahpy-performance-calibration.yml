name: aHPy Release Performance Calibration

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  performance-sample:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        sample: [1, 2, 3, 4, 5]
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/ahpy/requirements-hpy09.txt
      - name: Install exact stable benchmark lane
        run: python -m pip install -r tests/ahpy/requirements-hpy09.txt
      - name: Diagnose Universal toolchain
        run: python Tools/ahpy/doctor.py --python python --strict
      - name: Measure isolated hosted sample
        env:
          AHPY_BENCHMARK_SAMPLE_ID: ${{ matrix.sample }}
        run: >-
          python Tools/ahpy/benchmark_hpy.py
          --python python
          --output performance-results/benchmark-${{ matrix.sample }}.json
      - name: Upload immutable hosted sample
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ahpy-performance-sample-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.sample }}
          path: performance-results/benchmark-${{ matrix.sample }}.json
          if-no-files-found: error

  calibrate-release-budget:
    needs: performance-sample
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Download all five immutable samples
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ahpy-performance-sample-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: performance-history
          merge-multiple: true
      - name: Produce proposal-only release calibration
        run: >-
          python Tools/ahpy/calibrate_performance_budgets.py
          performance-history/benchmark-*.json
          --expected-commit ${{ github.sha }}
          --repository ${{ github.repository }}
          --minimum-reports 5
          --output performance-results/release-budget-proposal.json
      - name: Upload calibration proposal
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ahpy-release-performance-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: performance-results/release-budget-proposal.json
          if-no-files-found: error
