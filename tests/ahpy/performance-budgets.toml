schema_version = 1

[policy]
# Approved from the five immutable hosted samples and proposal in Actions run
# 34029830808. Every threshold below is the observed cohort maximum plus the
# proposal's exact 20% headroom; a new candidate remains bound by its own
# GitHub checkout identity rather than embedding its self-referential hash.
classification = "release"
release_enforced = true
calibration_status = "approved"
minimum_hosted_reports = 5
candidate_binding = "hosted-checkout"
calibration_source_commit = "22d8cbe1b50506f65e01be7ff05081616c656f2d"

[environment]
abi = "universal"
hpy = "0.9.0"
python_implementation = "CPython"

[measurement]
iterations = 100000
warmups = 2
repeats = 7

[large_type_compile]
# Per-profile ceiling for the 4.9 MB extension-type corpus. O0 is the required
# C-validity/liveness gate. O3 remains a bounded diagnostic because Ubuntu GCC
# 13 exceeded both 60 and 180 seconds on shared runners while O0 took ~5 s.
timeout_seconds = 60
enforce_o3 = false

[runtime_ratio]
# aHPy median / equivalent handwritten Universal HPy median. These are the
# exact proposal maxima from the reviewed five-sample Ubuntu cohort.
identity = 1.26
arithmetic = 1.27
container = 1.27
attribute = 1.21
call = 1.23
exception = 1.22
type_create = 1.25
type_method = 1.24
# Sequence-index iteration is the supported HPy 0.9 iteration surface; true
# iterator-protocol loops remain blocked and receive no performance number. The
# reviewed hosted range was 1.65x-1.97x; the release ceiling includes the
# proposal's exact 20% headroom.
iteration = 2.36
# Portable literal arguments bypass the Python-object round trip and match the
# handwritten one-call Trace contract. Dynamic values remain checked.
external_c = 1.22

[footprint]
generated_c_bytes = 36420
generated_binary_bytes = 296372
binary_to_reference_ratio = 1.42

[release_absolute]
cython_seconds = 1.77
native_build_seconds = 4.51
generated_peak_rss_bytes = 27726644
generated_to_reference_peak_rss_ratio = 1.20
large_type_frontend_seconds = 2.92
large_type_o0_seconds = 6.62
