schema_version = 1

[policy]
# These ceilings catch gross regressions; they are deliberately not release
# budgets until five same-HEAD hosted samples produce and a maintainer approves
# a calibration proposal.
classification = "regression"
release_enforced = false
calibration_status = "hosted-history-pending"
minimum_hosted_reports = 5
candidate_binding = "unbound"
calibration_source_commit = ""

[environment]
abi = "universal"
hpy = "0.9.0"
python_implementation = "CPython"

[measurement]
iterations = 100000
warmups = 2
repeats = 7

[large_type_compile]
# Per-profile ceiling for the 4.9 MB extension-type corpus. O0 is the required
# C-validity/liveness gate. O3 remains a bounded diagnostic because Ubuntu GCC
# 13 exceeded both 60 and 180 seconds on shared runners while O0 took ~5 s.
timeout_seconds = 60
enforce_o3 = false

[runtime_ratio]
# aHPy median / equivalent handwritten Universal HPy median. These initial
# budgets detect large regressions without pretending that shared CI runners
# provide release-grade absolute timings.
identity = 1.50
# Positional-only dispatch and direct-name borrowing make these paths match
# the handwritten HPy Trace/API contract; retain headroom for shared runners.
arithmetic = 1.50
container = 1.50
attribute = 1.50
call = 1.50
exception = 1.50
# Lazy type/module owners and borrowed HPyField operands make these paths
# equivalent to the handwritten reference apart from cinit's separate AsStruct.
type_create = 1.50
type_method = 1.50
# Sequence-index iteration is the supported HPy 0.9 iteration surface; true
# iterator-protocol loops remain blocked and receive no performance number. The
# initial 2.50x ceiling contains the observed 1.86x-2.00x local
# generated/reference range; hosted same-HEAD calibration must replace it for
# a release.
iteration = 2.50
# Portable literal arguments bypass the Python-object round trip and match the
# handwritten one-call Trace contract. Dynamic values remain checked.
external_c = 1.50

[footprint]
generated_c_bytes = 750000
generated_binary_bytes = 2000000
binary_to_reference_ratio = 20.0
